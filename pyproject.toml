[project]
name = "whakoom-scraper"
version = "2.0.0"
description = "Scraper and analyzer for public Whakoom manga/comic lists"
authors = [{ name = "Randy Consuegra", email = "rsconsuegra95@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27,<1",
    "parsel>=1.9,<2",
    "tenacity>=9,<10",
    "python-dotenv>=1,<2",
    "duckdb>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13,<14",
]

[project.scripts]
wk = "whakoom_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pre-commit>=3.8",
    "flake8>=7",
    "isort>=7",
    "pyupgrade>=3.21",
    "pylint>=4",
    "pydocstyle>=6",
    "sqlfluff>=4",
]
analysis = [
    "pandas>=2.2,<3",
    "jupyterlab>=4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whakoom_scraper", "whakoom_scraper.*"]
exclude = ["whakoom_scraper.tests*"]

[tool.pytest.ini_options]
testpaths = ["whakoom_scraper/tests"]

[tool.ruff]
line-length = 128
target-version = "py313"

[tool.mypy]
python_version = "3.13"
exclude = ["^whakoom_webscrapper/"]

[tool.bandit]
exclude_dirs = ["whakoom_scraper/tests"]

# Data-model dataclasses legitimately carry many fields; raise pylint's default
# attribute ceiling rather than disabling the rule per-file.
[tool.pylint.design]
max-attributes = 20
# Repository run-close carries several outcome counters; the callers pass them
# positionally, so allow a slightly higher argument count.
max-args = 8
max-positional-arguments = 8
